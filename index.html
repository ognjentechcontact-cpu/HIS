<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sveobuhvatni Bolnički Informacioni Sistem (BIS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .red-alert-banner { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <i class="fa-solid :fa-heart-pulse text-red-500 text-3xl animate-bounce"></i>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">NEXUS <span class="text-blue-500">MEDICA</span></h1>
                <p class="text-xs text-gray-400">Sveobuhvatni BIS v2.0 (2026)</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-6">
            <div class="bg-gray-700 px-4 py-2 rounded-lg border border-gray-600 flex items-center space-x-3">
                <i class="fa-solid fa-user-shield text-blue-400"></i>
                <div>
                    <span class="text-xs block text-gray-400 font-medium">Trenutna Uloga:</span>
                    <select id="global-role-selector" onchange="switchRole(this.value)" class="bg-transparent text-sm font-semibold text-white focus:outline-none cursor-pointer">
                        <option value="sestra" class="bg-gray-800">Trijažna Sestra</option>
                        <option value="lekar" class="bg-gray-800">Izabrani Lekar (Opšta Praksa)</option>
                        <option value="specijalista" class="bg-gray-800">Lekar Specijalista</option>
                        <option value="apoteka" class="bg-gray-800">Apotekar / Magacin</option>
                        <option value="finansije" class="bg-gray-800">Finansije i RFZO</option>
                        <option value="admin" class="bg-gray-800">Sistemski Administrator</option>
                    </select>
                </div>
            </div>
            <div class="text-right text-sm text-gray-400 hidden md:block">
                <i class="fa-regular fa-clock mr-1"></i> <span id="system-clock">--:--:--</span>
            </div>
        </div>
    </header>

    <div id="global-allergy-banner" class="hidden bg-red-600 text-white px-6 py-3 font-bold flex justify-between items-center red-alert-banner shadow-md">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            <span>KRITIČNO UPOZORENJE: Selektovani pacijent ima evidentirane teške alergije! Proveriti pre ordiniranja terapije.</span>
        </div>
        <button onclick="acknowledgeAllergyAlert()" class="bg-white text-red-700 px-4 py-1 rounded text-xs uppercase font-extrabold hover:bg-gray-100 transition">Potvrdi Prijem</button>
    </div>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col justify-between hidden md:flex">
            <div class="p-4 space-y-1" id="sidebar-menu">
                </div>
            <div class="p-4 bg-gray-800 border-t border-gray-700">
                <div class="flex items-center space-x-2 text-xs text-gray-500">
                    <i class="fa-solid fa-server"></i>
                    <span>Lokalni Storage Status:</span>
                    <span id="storage-indicator" class="text-green-400 font-bold">OK</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto bg-gray-950" id="main-content">
            </main>
    </div>

    <div id="global-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-850">
                <h3 id="modal-title" class="text-lg font-bold text-white">Naslov Modala</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 text-sm">
                </div>
        </div>
    </div>

    <script>
        // --- SEED PODACI ZA PRVO POKRETANJE (Ukoliko je Storage prazan) ---
        const SEED_PACIJENTI = [
            { id: "p1", ime: "Petar", prezime: "Petrović", jmbg: "1205984710023", lbo: "102938475", krvna_grupa: "A+", alergije: "Penicilin, Ibuprofen", hronične_bolesti: ["I10 - Esencijalna hipertenzija"], vitalni: { pritisak_sist: 135, pritisak_dias: 85, puls: 72, saturacija: 96, temperatura: 36.6, glikemija: 5.4 }, status: "U čekaonici", istorija: [] },
            { id: "p2", ime: "Milica", prezime: "Jovanović", jmbg: "2308991715042", lbo: "987654321", krvna_grupa: "0-", alergije: "Nema", hronične_bolesti: ["E11 - Dijabetes melitus tip 2"], vitalni: { pritisak_sist: 150, pritisak_dias: 95, puls: 88, saturacija: 94, temperatura: 37.1, glikemija: 8.2 }, status: "Kod lekara", istorija: [] },
            { id: "p3", ime: "Marko", prezime: "Nikolić", jmbg: "0102975710099", lbo: "456123789", krvna_grupa: "B+", alergije: "Plodovi mora", hronične_bolesti: [], vitalni: null, status: "Nije trijažiran", istorija: [] }
        ];

        const SEED_LEKARI = [
            { id: "l1", ime: "Dr Ivan", prezime: "Ivanović", licenca: "123456", specijalizacija: "Opšta praksa", kabinet: "Ordinacija 4" },
            { id: "l2", ime: "Dr Jelena", prezime: "Kardio", licenca: "654321", specijalizacija: "Kardiologija", kabinet: "Kabinet 102 (Ultrazvuk)" }
        ];

        const SEED_APOTEKA = [
            { id: "m1", naziv: "Enalapril 10mg", kolicina: 120, kritični_nivo: 20, tip: "Kutija" },
            { id: "m2", naziv: "Lemod-Solu 40mg", kolicina: 15, kritični_nivo: 20, tip: "Ampula" },
            { id: "m3", naziv: "Amoksicilin 500mg", kolicina: 80, kritični_nivo: 15, tip: "Kutija" }
        ];

        // --- INICIJALIZACIJA STANJA SISTEMA ---
        let DB = {
            pacijenti: JSON.parse(localStorage.getItem("bis_pacijenti")) || SEED_PACIJENTI,
            lekari: JSON.parse(localStorage.getItem("bis_lekari")) || SEED_LEKARI,
            apoteka: JSON.parse(localStorage.getItem("bis_apoteka")) || SEED_APOTEKA,
            uputi: JSON.parse(localStorage.getItem("bis_uputi")) || [],
            auditLogs: JSON.parse(localStorage.getItem("bis_audit")) || [],
            fakture: JSON.parse(localStorage.getItem("bis_fakture")) || [],
            stacionar: JSON.parse(localStorage.getItem("bis_stacionar")) || { krevati: Array(10).fill(null).map((_,i) => ({ broj: i+1, pacijentId: null, status: "Slobodan" })) },
            trenutniPacijentId: null,
            aktivnaUloga: localStorage.getItem("bis_uloga") || "sestra",
            draftPregled: JSON.parse(localStorage.getItem("bis_draft")) || {}
        };

        function sacuvajUBazu() {
            localStorage.setItem("bis_pacijenti", JSON.stringify(DB.pacijenti));
            localStorage.setItem("bis_lekari", JSON.stringify(DB.lekari));
            localStorage.setItem("bis_apoteka", JSON.stringify(DB.apoteka));
            localStorage.setItem("bis_uputi", JSON.stringify(DB.uputi));
            localStorage.setItem("bis_audit", JSON.stringify(DB.auditLogs));
            localStorage.setItem("bis_fakture", JSON.stringify(DB.fakture));
            localStorage.setItem("bis_stacionar", JSON.stringify(DB.stacionar));
            localStorage.setItem("bis_uloga", DB.aktivnaUloga);
            localStorage.setItem("bis_draft", JSON.stringify(DB.draftPregled));
        }

        // --- REVIZIJA I BEZBEDNOST (AUDIT LOG) ---
        function upisiAuditLog(akcija, detalji, pacijentId = null) {
            let log = {
                timestamp: new Date().toLocaleString("sr-RS"),
                korisnik: DB.aktivnaUloga.toUpperCase(),
                ip: "192.168.1." + Math.floor(Math.random() * 254 + 1),
                akcija: akcija,
                detalji: detalji,
                pacijentId: pacijentId
            };
            DB.auditLogs.unshift(log);
            sacuvajUBazu();
        }

        // --- SAT I TAJMERI ---
        setInterval(() => {
            document.getElementById("system-clock").innerText = new Date().toLocaleTimeString("sr-RS");
        }, 1000);

        // --- UKLJUČIVANJE I MENJANJE ULOGA (RBAC ENGINE) ---
        function initApp() {
            document.getElementById("global-role-selector").value = DB.aktivnaUloga;
            switchRole(DB.aktivnaUloga);
        }

        function switchRole(novaUloga) {
            DB.aktivnaUloga = novaUloga;
            sacuvajUBazu();
            upisiAuditLog("PROMENA_ULOGE", `Korisnik prešao na ulogu: ${novaUloga}`);
            
            // Provera alergije pri promeni ekrana ako pacijent postoji
            proveriAlergijskiBanner();
            
            renderSidebar();
            renderModul();
        }

        function proveriAlergijskiBanner() {
            let banner = document.getElementById("global-allergy-banner");
            if (DB.trenutniPacijentId) {
                let p = DB.pacijenti.find(x => x.id === DB.trenutniPacijentId);
                if (p && p.alergije && p.alergije !== "Nema" && p.alergije !== "") {
                    banner.classList.remove("hidden");
                    return;
                }
            }
            banner.classList.add("hidden");
        }

        function acknowledgeAllergyAlert() {
            document.getElementById("global-allergy-banner").classList.add("hidden");
            upisiAuditLog("POTVRDA_ALERGIJE", "Korisnik eksplicitno potvrdio svest o alergijama pacijenta", DB.trenutniPacijentId);
        }

        // --- RENDER SIDEBARA NA OSNOVU PRAVA PRISTUPA ---
        function renderSidebar() {
            let menu = document.getElementById("sidebar-menu");
            let html = "";
            
            const stavke = {
                sestra: [
                    { ikona: "fa-address-card", tekst: "Trijaža i Prijem", akcija: "prikaziPrijem()" },
                    { ikona: "fa-users-viewfinder", tekst: "Queue / Čekaonica", akcija: "prikaziCekaonicu()" }
                ],
                lekar: [
                    { ikona: "fa-user-doctor", tekst: "Pregled i Karton (EZK)", akcija: "prikaziLekarskiPanel()" },
                    { ikona: "fa-file-medical", tekst: "Kreiranje OZ2 Uputa", akcija: "prikaziKreiranjeUputa()" }
                ],
                specijalista: [
                    { ikona: "fa-hospital-user", tekst: "Prosleđeni Pacijenti", akcija: "prikaziSpecijalistickiPanel()" },
                    { ikona: "fa-bed-pulse", tekst: "Stacionar / Bed Mgmt", akcija: "prikaziStacionar()" }
                ],
                apoteka: [
                    { ikona: "fa-prescription-bottle-medical", tekst: "Centralni Magacin", akcija: "prikaziApoteku()" },
                    { ikona: "fa-receipt", tekst: "Realizacija eRecepata", akcija: "prikaziRealizacijuRecepata()" }
                ],
                finansije: [
                    { ikona: "fa-calculator", tekst: "Fakturisanje (DRG)", akcija: "prikaziFinansije()" }
                ],
                admin: [
                    { ikona: "fa-shield-halved", tekst: "Audit Logs (Tragovi)", akcija: "prikaziAuditLog()" },
                    { ikona: "fa-database", tekst: "Upravljanje Bazi", akcija: "prikaziAdminPanel()" }
                ]
            };

            stavke[DB.aktivnaUloga].forEach(s => {
                html += `<button onclick="${s.akcija}" class="w-full flex items-center space-x-3 text-gray-300 hover:bg-gray-700 hover:text-white px-4 py-3 rounded-lg text-sm font-medium transition duration-200">
                    <i class="fa-solid ${s.ikona} w-5 text-gray-400"></i>
                    <span>${s.tekst}</span>
                </button>`;
            });

            menu.innerHTML = html;
        }

        function renderModul() {
            // Podrazumevani startni ekrani za svaku ulogu
            if (DB.aktivnaUloga === "sestra") prikaziPrijem();
            if (DB.aktivnaUloga === "lekar") prikaziLekarskiPanel();
            if (DB.aktivnaUloga === "specijalista") prikaziSpecijalistickiPanel();
            if (DB.aktivnaUloga === "apoteka") prikaziApoteku();
            if (DB.aktivnaUloga === "finansije") prikaziFinansije();
            if (DB.aktivnaUloga === "admin") prikaziAuditLog();
        }

        // --- GLOBALNE POMOĆNE FUNKCIJE ZA MODAL ---
        function otvoriModal(naslov, sadrzajHtml) {
            document.getElementById("modal-title").innerText = naslov;
            document.getElementById("modal-body").innerHTML = sadrzajHtml;
            document.getElementById("global-modal").classList.remove("hidden");
        }
        function closeModal() {
            document.getElementById("global-modal").classList.add("hidden");
        }

        // =========================================================================
        // 1. MODUL: TRIJAŽNA SESTRA (PRIJEM, VITALNI PARAMETRI, QUEUE)
        // =========================================================================
        function prikaziPrijem() {
            let html = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-white">Prijem i Trijažna Stanica</h2>
                        <button onclick="brziPrijemNovogPacijenta()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center space-x-2"><i class="fa-solid fa-plus"></i> <span>Novi Pacijent</span></button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-gray-800 border border-gray-700 p-5 rounded-xl space-y-4 shadow-md">
                            <h3 class="text-md font-bold text-gray-200 border-b border-gray-700 pb-2"><i class="fa-solid fa-id-card text-blue-500 mr-2"></i>Skeniranje Knjižice</h3>
                            <div class="bg-gray-900 border-2 border-dashed border-gray-600 rounded-lg p-6 text-center cursor-pointer hover:border-blue-500 transition" onclick="simulirajSkeniranjeKartice()">
                                <i class="fa-solid fa-credit-card text-4xl text-gray-500 mb-2"></i>
                                <p class="text-sm font-medium text-gray-300">KLIKNI OVDE ZA SIMULACIJU PROVLAČENJA KARTICE</p>
                                <p class="text-xs text-gray-500 mt-1">Sistem automatski povlači podatke sa RFZO servera</p>
                            </div>
                        </div>

                        <div class="bg-gray-800 border border-gray-700 p-5 rounded-xl md:col-span-2 shadow-md">
                            <h3 class="text-md font-bold text-gray-200 border-b border-gray-700 pb-2"><i class="fa-solid fa-list-check text-green-500 mr-2"></i>Pacijenti u Sistemu</h3>
                            <div class="overflow-x-auto mt-4">
                                <table class="w-full text-left text-sm text-gray-300">
                                    <thead class="bg-gray-700 text-xs text-gray-400 uppercase">
                                        <tr>
                                            <th class="p-3">Ime i Prezime</th>
                                            <th class="p-3">JMBG / LBO</th>
                                            <th class="p-3">Status</th>
                                            <th class="p-3 text-right">Akcija</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-700">
                                        ${DB.pacijenti.map(p => `
                                            <tr class="hover:bg-gray-750">
                                                <td class="p-3 font-semibold text-white">${p.ime} ${p.prezime}</td>
                                                <td class="p-3 text-xs">${p.jmbg}<br><span class="text-gray-500">${p.lbo}</span></td>
                                                <td class="p-3">
                                                    <span class="px-2 py-1 rounded text-xs font-bold ${p.status === 'Nije trijažiran' ? 'bg-yellow-900/50 text-yellow-400 border border-yellow-700' : 'bg-green-900/50 text-green-400 border border-green-700'}">
                                                        ${p.status}
                                                    </span>
                                                </td>
                                                <td class="p-3 text-right">
                                                    <button onclick="otvoriTrijažniUnos('${p.id}')" class="bg-blue-600/30 text-blue-400 border border-blue-500/50 hover:bg-blue-600 hover:text-white px-3 py-1 rounded text-xs transition font-semibold">
                                                        <i class="fa-solid fa-heart-pulse mr-1"></i> Vitalni Parametri
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("main-content").innerHTML = html;
        }

        function simulirajSkeniranjeKartice() {
            let p = DB.pacijenti[Math.floor(Math.random() * DB.pacijenti.length)];
            DB.trenutniPacijentId = p.id;
            proveriAlergijskiBanner();
            upisiAuditLog("SKENIRANJE_KNJIŽICE", `Skenirana kartica za pacijenta: ${p.ime} ${p.prezime} via Čitač SmartCard`, p.id);
            otvoriTrijažniUnos(p.id);
        }

        function otvoriTrijažniUnos(id) {
            DB.trenutniPacijentId = id;
            proveriAlergijskiBanner();
            let p = DB.pacijenti.find(x => x.id === id);
            let v = p.vitalni || { pritisak_sist: '', pritisak_dias: '', puls: '', saturacija: '', temperatura: '', glikemija: '' };
            
            let html = `
                <form id="trijaza-form" onsubmit="sacuvajTrijažu(event, '${p.id}')" class="space-y-4">
                    <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 grid grid-cols-2 gap-4 text-xs">
                        <div><span class="text-gray-400">Pacijent:</span> <strong class="text-white text-sm">${p.ime} ${p.prezime}</strong></div>
                        <div><span class="text-gray-400">Krvna Grupa:</span> <strong class="text-red-400 text-sm">${p.krvna_grupa}</strong></div>
                        <div class="col-span-2"><span class="text-gray-400">Alergije:</span> <strong class="text-red-500 font-bold">${p.alergije}</strong></div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Pritisak (Sistolni) [mmHg]</label>
                            <input type="number" required id="v_sist" value="${v.pritisak_sist}" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Pritisak (Dijastolni) [mmHg]</label>
                            <input type="number" required id="v_dias" value="${v.pritisak_dias}" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Puls (bpm)</label>
                            <input type="number" required id="v_puls" value="${v.puls}" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Saturacija SpO2 (%)</label>
                            <input type="number" required id="v_sat" value="${v.saturacija}" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Temperatura (°C)</label>
                            <input type="number" step="0.1" required id="v_temp" value="${v.temperatura}" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Glikemija (mmol/L)</label>
                            <input type="number" step="0.1" required id="v_glik" value="${v.glikemija}" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-bold">
                        </div>
                    </div>
                    <div class="text-right pt-4 border-t border-gray-700">
                        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded font-bold text-sm">Prosledi u Čekaonicu lekara</button>
                    </div>
                </form>
            `;
            otvoriModal(`Unos Vitalnih Parametara - ${p.ime} ${p.prezime}`, html);
        }

        function sacuvajTrijažu(e, id) {
            e.preventDefault();
            let p = DB.pacijenti.find(x => x.id === id);
            p.vitalni = {
                pritisak_sist: parseInt(document.getElementById("v_sist").value),
                pritisak_dias: parseInt(document.getElementById("v_dias").value),
                puls: parseInt(document.getElementById("v_puls").value),
                saturacija: parseInt(document.getElementById("v_sat").value),
                temperatura: parseFloat(document.getElementById("v_temp").value),
                glikemija: parseFloat(document.getElementById("v_glik").value)
            };
            p.status = "U čekaonici";
            sacuvajUBazu();
            upisiAuditLog("TRIJAŽA_ZAVRŠENA", `Uneti vitalni parametri: TA ${p.vitalni.pritisak_sist}/${p.vitalni.pritisak_dias}, SpO2 ${p.vitalni.saturacija}%`, id);
            closeModal();
            prikaziPrijem();
        }

        function prikaziCekaonicu() {
            let html = `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold text-white"><i class="fa-solid fa-tv text-blue-500 mr-2"></i>Digitalna Čekaonica (Queue Monitor)</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-black border-4 border-gray-700 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
                            <div class="bg-gray-900 text-green-400 font-mono text-3xl py-3 rounded-lg tracking-widest border border-green-900">TRENUTNO PROZVANI BROJEVI</div>
                            <div class="space-y-2">
                                ${DB.pacijenti.filter(x => x.status === "Kod lekara").map(p => `
                                    <div class="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-blue-900/50">
                                        <span class="text-2xl font-bold text-yellow-400 font-mono">KOD-0${p.id.replace('p','')}</span>
                                        <i class="fa-solid fa-arrow-right-long text-xl text-white animate-ping"></i>
                                        <span class="text-2xl font-extrabold text-white">ORDINACIJA 4</span>
                                    </div>
                                `).join('') || '<p class="text-gray-500 py-4">Nema aktivnih prozivki trenutno.</p>'}
                            </div>
                        </div>

                        <div class="bg-gray-800 border border-gray-700 p-5 rounded-xl shadow-md">
                            <h3 class="text-md font-bold text-gray-200 border-b border-gray-700 pb-2">Upravljanje Redom</h3>
                            <div class="space-y-3 mt-4">
                                ${DB.pacijenti.filter(x => x.status === "U čekaonici").map(p => `

        function azurirajDraft(pacijentId, polje, vrednost) {
            DB.draftPregled[pacijentId][polje] = vrednost;

        }

        function zakljuciPregledLekara(pacijentId) {
            let p = DB.pacijenti.find(x => x.id === pacijentId);
            let draft = DB.draftPregled[pacijentId];
            let terapijaInput = document.getElementById("dr_terapija").value;

            if (!draft.anamneza || !draft.status_praesens) {
                alert("Greška: Anamneza i Status Praesens ne mogu biti prazni za završetak i potpisivanje.");
                return;
            }

            let noviPregled = {
                datum: new Date().toLocaleString("sr-RS"),
                lekar: "Dr Ivan Ivanović (Opšta praksa)",
                anamneza: draft.anamneza,
                status_praesens: draft.status_praesens,
                dg: draft.dg_kod,
                terapija: terapijaInput || "Nema"
            };

            p.istorija.unshift(noviPregled);
            p.status = "Završen";

            // DRG / Finansijsko automatsko tarifiranje u pozadini
            let drgKoeficijent = draft.dg_kod === "I10" ? 1.2 : (draft.dg_kod === "E11" ? 1.8 : 0.9);
            DB.fakture.unshift({
                id: "F-" + Math.floor(Math.random()*90000 + 10000),
                pacijent: `${p.ime} ${p.prezime}`,
                jmbg: p.jmbg,
                glavna_dg: draft.dg_kod,
                drg_koef: drgKoeficijent,
                iznos_rfzo: drgKoeficijent * 12500, // fiktivna osnovica po poenu
                status: "Generisano / Čeka RFZO slanje"
            });

            // Čišćenje drafta
            delete DB.draftPregled[pacijentId];
            sacuvajUBazu();
            upisiAuditLog("ZAVRŠEN_PREGLED", `Zaključen nalaz pod šifrom ${noviPregled.dg}. Generisana DRG faktura.`, pacijentId);
            
            // Automatski otvori šablon za štampanje i PDF arhiviranje
            printLekarskiIzvestaj(pacijentId, noviPregled);
            prikaziLekarskiPanel();
        }

                `;

            html += `<button onclick="emitujUputInbaza('${tip}')" class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded font-bold text-sm mt-2 transition shadow">Zavedi i Potpiši Uput digitalno</button>`;
            container.innerHTML = html;
        }

        function emitujUputInbaza(tip) {
            let p = DB.pacijenti.find(x => x.id === DB.trenutniPacijentId);
            let noviUput = {
                id: "U-OZ2-" + Math.floor(Math.random() * 90000 + 10000),
                pacijentId: p.id,
                pacijentIme: `${p.ime} ${p.prezime}`,
                tip: tip,
                datum: new Date().toLocaleString("sr-RS"),
                status: "Aktivan / Prosleđen",
                detalji: {}
            };

            if (tip === "Specijalistički") {
                noviUput.detalji = { grana: document.getElementById("u_spec_grana").value, napomena: document.getElementById("u_napomena").value };
            } else if (tip === "Laboratorijski") {
                noviUput.detalji = { kks: document.getElementById("l_kks").checked, biohemija: document.getElementById("l_bio").checked, urin: document.getElementById("l_urin").checked };
                // Automatska simulacija LIS-a u pozadini nakon 5 sekundi (za potrebe skladištenja i rada aplikacije)
                simulirajLaboratorijskiUredjaj(noviUput.id);
            } else if (tip === "Stacionarni") {
                noviUput.detalji = { dg: document.getElementById("u_stac_dg").value, indikacija: document.getElementById("u_stac_ind").value };
            }

            DB.uputi.unshift(noviUput);
            sacuvajUBazu();
            upisiAuditLog(`KREIRAN_UPUT_${tip.toUpperCase()}`, `Generisan digitalni obrazac OZ2, prosleđen u podsistem. ID: ${noviUput.id}`, p.id);
            alert(`Uput ${tip} uspešno kreiran i digitalno potpisan.`);
            prikaziLekarskiPanel();
        }

        function simulirajLaboratorijskiUredjaj(uputId) {
            setTimeout(() => {
                let uput = DB.uputi.find(x => x.id === uputId);
                if (uput) {
                    uput.status = "Završen (LIS integrisan)";
                    let p = DB.pacijenti.find(x => x.id === uput.pacijentId);
                    
                    // Ubaci veštačke rezultate merenja mašine u istoriju pacijenta
                    p.istorija.unshift({
                        datum: new Date().toLocaleString("sr-RS"),
                        lekar: "Sistem (LIS - Automatski Analizator)",
                        anamneza: "Integrisano očitavanje bar-koda epruvete preko HL7 FHIR protokola.",
                        status_praesens: `Leukociti: 7.4 (4-10), Eritrociti: 4.8 (4.1-5.5), Hemoglobin: 105 L (110-180) [CRVENO], Sećer u krvi: 6.1 (3.9-6.1)`,
                        dg: "LAB-NALAZ",
                        terapija: "Nema (Laboratorijski izveštaj prosleđen izabranom lekaru)"
                    });
                    sacuvajUBazu();
                    upisiAuditLog("LIS_AUTOMATSKA_ANALIZA", `Analizator očitao barkod za uput ${uputId}, rezultati upisani u karton automatski.`, p.id);
                }
            }, 3000);
        }

            sacuvajUBazu();

            prikaziStacionar();
        }

                        <button onclick="obrisiSveIRestartuj()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 rounded-lg text-sm transition"><i class="fa-solid fa-trash-can mr-2"></i> Fabrički Reset Kompletnog Lokalog Storage-a</button>
                    </div>
                </div>
            `;
            document.getElementById("main-content").innerHTML = html;
        }

        function obrisiSveIRestartuj() {
            if(confirm("PAŽNJA! Ovo će nepovratno obrisati sve unete pacijente, vitalne parametre, upute i audit logove iz memorije pretraživača. Nastaviti?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

                        <div class="text-right">
